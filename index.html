<!doctype html>
<html lang="zh-Hant-TW" data-accent="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F5">
<meta name="robots" content="noindex">
<title>慾望清單・冷靜期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 基礎色票：極簡日系無印風 ============ */
:root{
  --bg:#FBF9F5;          /* Soft Cream */
  --card:#FFFFFF;        /* Warm White */
  --text:#292524;        /* Warm Charcoal */
  --muted:#78716C;
  --faint:#A8A29E;
  --line:#ECE7DE;
  --line-2:#DDD6C9;
  --soft:#F6F3EE;
  --soft-2:#EFEBE3;
  --accent:#78866B;      /* Sage Green */
  --accent-ink:#5D6A51;
  --accent-soft:rgba(120,134,107,.12);
  --accent-line:rgba(120,134,107,.38);
  --danger:#A8564C;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(41,37,36,.04),0 6px 20px rgba(41,37,36,.04);
  --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}
html[data-accent="slate"]{
  --accent:#64748B;      /* Slate Blue */
  --accent-ink:#475569;
  --accent-soft:rgba(100,116,139,.12);
  --accent-line:rgba(100,116,139,.38);
}
/* ============ 金額區間 / 冷靜期配色 (Severity) ============ */
.t-green  {--t:#10B981;--t-ink:#047857;--t-bg:rgba(16,185,129,.10);--t-bd:rgba(16,185,129,.30)}
.t-amber  {--t:#F59E0B;--t-ink:#B45309;--t-bg:rgba(245,158,11,.10);--t-bd:rgba(245,158,11,.30)}
.t-orange {--t:#F97316;--t-ink:#C2410C;--t-bg:rgba(249,115,22,.10);--t-bd:rgba(249,115,22,.30)}
.t-crimson{--t:#EF4444;--t-ink:#BE123C;--t-bg:rgba(244,63,94,.10);--t-bd:rgba(244,63,94,.30)}
.t-violet {--t:#8B5CF6;--t-ink:#6D28D9;--t-bg:rgba(139,92,246,.10);--t-bd:rgba(139,92,246,.30)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent-ink)}
h1,h2,h3,h4{font-weight:500}
.desc{font-size:12.5px;color:var(--muted);margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft-2);color:var(--text)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{cursor:not-allowed;opacity:.6;background:var(--soft)}
.btn svg{width:14px;height:14px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--muted);flex:none;display:inline-grid;place-items:center;font-size:13px}
.icon-btn:hover{background:var(--soft-2);color:var(--text)}
.icon-btn svg{width:15px;height:15px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}

/* inputs */
input[type=text],input[type=number],input[type=password],input[type=url],input[type=date],input[type=search],select,textarea{
  width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s;font-size:14px}
select{padding-right:8px}
textarea{height:auto;min-height:64px;padding:9px 12px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;cursor:pointer;line-height:1.5}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}

/* brand mark：一個停頓的圓 */
.mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);display:inline-grid;place-items:center;flex:none}
.mark::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent)}
.mark.sm{width:28px;height:28px}.mark.sm::after{width:9px;height:9px}
.mark.lg{width:48px;height:48px}.mark.lg::after{width:15px;height:15px}

/* ============ Lock screen ============ */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lock-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 28px 22px;box-shadow:var(--shadow);text-align:center}
.lock-card h1{margin:16px 0 2px;font-size:22px;letter-spacing:.12em}
.lock-sub{margin:0;color:var(--muted);font-size:13px;letter-spacing:.2em}
.lock-fields{display:flex;flex-direction:column;gap:10px;margin:26px 0 6px;text-align:left}
.lock-note{font-size:13px;color:var(--muted);margin:0 0 4px;line-height:1.7}
.lock-note b{color:var(--text);font-weight:500}
.lock-foot{font-size:12px;color:var(--faint);margin:18px 0 6px;line-height:1.7}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:4px 0 10px}

/* ============ Top bar ============ */
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.9);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-weight:700;font-size:16px;letter-spacing:.08em;display:block;line-height:1.2}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.22em;line-height:1.4}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{border:none;background:none;padding:6px 15px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.top-actions{display:flex;align-items:center;gap:6px}
.save-ind{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;margin-right:6px;white-space:nowrap}
.save-ind i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transition:background .2s}
.save-ind.saved i{animation:glow 1.2s ease-out 1}
.save-ind.saving i{background:var(--faint);box-shadow:none;animation:pulse 1s infinite}
.save-ind.error i{background:var(--danger);box-shadow:none}
button.save-ind{border:none;background:none;cursor:pointer;padding:5px 9px;border-radius:999px;font-size:12px;color:var(--muted);margin-right:2px}
button.save-ind:hover{background:var(--soft-2);color:var(--text)}
.save-ind span{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.save-ind.local i{background:var(--faint);box-shadow:0 0 0 3px rgba(168,162,158,.18)}
.save-ind.warn i{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.save-ind.error{color:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent-line)}100%{box-shadow:0 0 0 3px var(--accent-soft)}}

.main{max-width:1180px;margin:0 auto;padding:24px 20px 96px}

/* ============ List view ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:1px}
.stat-label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat-num{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.35}
.stat-num small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.stat-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat.good .stat-sub{color:var(--accent-ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;background:var(--soft-2);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:none;background:none;padding:5px 13px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(41,37,36,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{width:190px;height:34px}
.filters select{width:auto;min-width:112px;height:34px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px 20px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;transition:box-shadow .2s}
.item:hover{box-shadow:var(--shadow)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--t)}
.item.done{background:#FDFCFA}
.item.done::before{opacity:.4}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--t-bg);color:var(--t-ink);border:1px solid var(--t-bd)}
.prio{font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:0 7px;min-width:26px;text-align:center}
.item h3{margin:2px 0 0;font-size:15.5px;line-height:1.5;word-break:break-word}
.amount{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px}
.tag{font-size:11.5px;padding:0 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink)}
.track{height:4px;background:var(--soft-2);border-radius:99px;overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;background:var(--t);border-radius:99px;opacity:.75}
.cd{font-size:13px}
.cd b{font-weight:500;color:var(--t-ink);font-variant-numeric:tabular-nums}
.facts{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line-2);padding-left:9px;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link-out{font-size:12.5px;color:var(--accent-ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.link-out:hover{text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.actions .spacer{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);background:rgba(255,255,255,.4)}
.empty h3{color:var(--text);margin:16px 0 4px;font-size:17px}
.empty p{margin:0}
.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* ============ Panels ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel h2{font-size:15.5px;margin:0}
.panel h3{font-size:14px;margin:0 0 4px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;margin-bottom:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}

/* ============ Calendar ============ */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.cal-nav h2{margin:0 auto 0 0;font-size:18px;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.cal-cell{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
.cal-cell:hover{background:var(--soft)}
.cal-cell.out{background:#FCFBF8}
.cal-cell.out .cal-num{color:var(--faint)}
.cal-cell.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.cal-head{display:flex;align-items:center;gap:4px;min-width:0;margin-bottom:2px}
.cal-num{font-size:12.5px;width:23px;height:23px;display:inline-grid;place-items:center;border-radius:50%;flex:none;font-variant-numeric:tabular-nums}
.today .cal-num{background:var(--accent);color:#fff}
.fest{font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);padding:0 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{font-size:11.5px;line-height:1.55;padding:0 6px;border-radius:5px;background:var(--t-bg);color:var(--t-ink);border:1px solid var(--t-bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.start::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--t);margin-right:5px;vertical-align:middle;position:relative;top:-1px}
.chip.unlock{background:transparent;border-style:dashed}
.chip[draggable=true]{cursor:grab}
.more{font-size:11px;color:var(--muted);background:none;border:none;text-align:left;padding:0 2px;cursor:pointer}
.more:hover{color:var(--text)}
.drill-item{padding:12px 0 10px;border-top:1px solid var(--line)}
.drill-item:first-of-type{margin-top:12px}
.drill-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.drill-title b{font-weight:500}
.drill-title span{font-size:12px;color:var(--muted)}
.drill-row{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.drill-row.late{color:var(--faint)}
.drill-row.late .dot{opacity:.35}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);display:inline-block;margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend-row .chip{width:58px;flex:none;cursor:default}

/* ============ Gantt ============ */
.pool{font-size:13px;color:var(--muted)}
.pool b{color:var(--accent-ink);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.g-axis,.g-row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:center}
.g-axis .g-track{height:20px}
.g-tick{position:absolute;top:0;font-size:11px;color:var(--faint);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.g-row{padding:9px 0;border-top:1px solid var(--line)}
.g-label{min-width:0;cursor:pointer}
.g-label b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-label:hover b{color:var(--accent-ink)}
.g-track{position:relative;height:28px}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-today{position:absolute;top:-10px;bottom:-10px;width:0;border-left:1.5px dashed var(--accent);z-index:2}
.g-bar{position:absolute;top:3px;height:22px;border-radius:6px;background:var(--t-bg);border:1px solid var(--t-bd);display:flex;align-items:center;overflow:hidden;z-index:1}
.g-fill{position:absolute;left:0;top:0;bottom:0;background:var(--t);opacity:.2}
.g-bar.unlocked .g-fill{opacity:.42}
.g-text{position:relative;font-size:11.5px;color:var(--t-ink);padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-text.out{position:absolute;top:6px;padding:0;z-index:1}
.g-today-label{position:absolute;top:-2px;font-size:10.5px;color:var(--accent-ink);transform:translateX(-50%);background:var(--card);padding:0 4px;z-index:3}
.g-empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.budget{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.budget-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:8px;gap:8px}
.budget-top b{font-weight:500;font-variant-numeric:tabular-nums}
.budget-top b.over{color:#BE123C}
.bar{height:10px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.over i{background:#EF4444;opacity:.7}
.bar + .desc{margin-top:8px}
.goal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.mini{background:var(--soft);border-radius:10px;padding:12px 14px}
.mini small{display:block;color:var(--muted);font-size:12px}
.mini b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.mini p{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* ============ Settings ============ */
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.settings .panel > .desc{margin:4px 0 14px}
.list-edit{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto;padding:2px 4px 2px 2px}
.le-row{display:flex;gap:6px;align-items:center}
.le-row input{height:34px}
.le-row input.num{width:64px;flex:none;text-align:center;padding:0 6px}
.le-row .rule{font-size:12px;color:var(--muted);white-space:nowrap;flex:none;width:134px;text-align:center}
.le-row .count{font-size:12px;color:var(--faint);white-space:nowrap;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.le-row .order{font-size:12px;color:var(--faint);width:18px;text-align:center;flex:none}
.add-row{display:flex;gap:6px;margin-top:12px}
.add-row input{height:34px}
.add-row input.num{width:64px;flex:none;text-align:center;padding:0 6px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.swatches{display:flex;gap:10px;margin:8px 0 18px}
.sw{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--card);cursor:pointer;font-size:13px}
.sw i{width:16px;height:16px;border-radius:50%}
.sw.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.field-row select{width:auto}
.zone{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2)}
.zone h3{color:var(--danger);font-size:13px}

/* ============ Sync ============ */
.sync-panel{grid-column:1/-1}
.sync-panel > .desc{margin:0}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--soft-2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.on{background:var(--accent-soft);color:var(--accent-ink)}
.pill.warn{background:rgba(245,158,11,.12);color:#B45309}
.pill.bad{background:rgba(168,86,76,.1);color:var(--danger)}

<script>
(() => {
'use strict';

/* =====================================================================
 * 1. 常數：冷靜期矩陣 / 預設分類
 * ===================================================================== */
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const PBKDF2_ITER = 310000;

const TIERS = [
  { key:'green',   max:500,      sign:'$',     label:'微額', days:1,  cls:'t-green',   questions:['是否為重複購買？','家中有無同等替代品？'] },
  { key:'amber',   max:3000,     sign:'$$',    label:'小額', days:3,  cls:'t-amber',   questions:['一週後是否依然渴望？','是否符合本月預算？'] },
  { key:'orange',  max:10000,    sign:'$$$',   label:'中額', days:7,  cls:'t-orange',  questions:['換算需要工作多少小時？你能接受嗎？','能否改租借或買二手？'] },
  { key:'crimson', max:30000,    sign:'$$$$',  label:'大額', days:14, cls:'t-crimson', questions:['是否會破壞年度儲蓄計畫？','是否有非買不可的急迫性？'] },
  { key:'violet',  max:Infinity, sign:'$$$$$', label:'重大', days:30, cls:'t-violet',  questions:['是否需要召開家庭會議？','是否牽涉分期付款與利息？'] },
];
const tierOf = a => TIERS.find(t => (Number(a) || 0) <= t.max);
const tierDays = t => t.days === 1 ? '24 小時' : `${t.days} 天`;

const DEFAULT_CATS = ['運動健身','寵物用品','教育學習','生活居家','旅遊度假','3C 數位','美妝護膚','服飾鞋包','汽機車配件','娛樂電玩',
  '戶外露營','美食餐飲','汽水零食','書籍雜誌','工作生產力','展覽演出','禮物送禮','理財投資','訂閱服務','雜項支出'];

function defaultState(){
  return {
    v: 1,
    settings: { savingsPool:50000, savingsGoal:100000, monthlySaving:10000, hourlyWage:200, accent:'sage', autoLockMin:15 },
    categories: DEFAULT_CATS.map((name,i) => ({ id:'c'+String(i+1).padStart(2,'0'), name })),
    priorities: [ {id:'pB',name:'B'}, {id:'pM',name:'M'}, {id:'pH',name:'H'} ],
    festivals: [
      { id:'f618',  name:'618 年中慶', m:6,  d:18 },
      { id:'f88',   name:'88 父親節',  m:8,  d:8 },
      { id:'f1111', name:'雙 11',      m:11, d:11 },
      { id:'fbf',   name:'黑色星期五', rule:'blackfriday' },
      { id:'f1212', name:'雙 12',      m:12, d:12 },
      { id:'fxmas', name:'聖誕節',     m:12, d:25 },
    ],
    items: [],
    deleted: {},      // 已刪除品項的墓碑 { id: 刪除時間 }，跨裝置同步用
    confAt: 0,        // 分類／順序／購物節／設定 最後修改時間
    sync: null,       // { gistId, token }，只存在本機加密資料中，不上傳
    draft: null,
    ui: { tab:'list', calY:null, calM:null, lastCat:null },
  };
}

/* =====================================================================
 * 2. 工具函式
 * ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => 'NT$ ' + Math.round(Number(n) || 0).toLocaleString('zh-TW');
const n1 = x => (Math.round(x * 10) / 10).toLocaleString('zh-TW');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d).getTime(); };
const sod = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtMD = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtDT = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const safeUrl = u => { const s = String(u || '').trim(); return /^https?:\/\//i.test(s) ? s : ''; };
const sum = a => a.reduce((s,i) => s + (Number(i.amount) || 0), 0);
const hostOf = u => { try { const x = new URL(u); return x.hostname.replace(/^www\./,'') + x.pathname.replace(/\/$/,''); } catch { return u; } };

function remain(ms){
  if (ms <= 0) return '0 分鐘';
  const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.ceil(ms % HOUR / MIN);
  if (d > 0) return `${d} 天 ${h} 小時`;
  if (h > 0) return `${h} 小時 ${m % 60} 分`;
  return `${m} 分鐘`;
}
function remainShort(ms){
  if (ms >= DAY) return `${Math.ceil(ms / DAY)} 天`;
  if (ms >= HOUR) return `${Math.ceil(ms / HOUR)} 小時`;
  return `${Math.max(1, Math.ceil(ms / MIN))} 分鐘`;
}

const ICON = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* =====================================================================
 * 3. 加密（Web Crypto：PBKDF2 → AES-256-GCM）
 * ===================================================================== */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = buf => b64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return unb64(s); };

async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(ct), savedAt:Date.now() };
}
async function unseal(key, v){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(v.iv) }, key, unb64(v.ct));
  return JSON.parse(td.decode(pt));
}

/* =====================================================================
 * 4. 儲存層：IndexedDB（主）+ localStorage（鏡像備援）
 *    儲存內容只有密文；salt / iter 與密文放在同一筆紀錄，確保原子寫入
 * ===================================================================== */
const IDB = {
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open('dms', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(k){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
};
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
async function readVault(){
  let a = null; try { a = await IDB.get('vault'); } catch {}
  const b = LS.get('dms.vault');
  if (a && b) return (b.savedAt || 0) > (a.savedAt || 0) ? b : a;
  return a || b;
}
async function writeVault(v){
  let ok = false;
  try { await IDB.set('vault', v); ok = true; } catch {}
  if (LS.set('dms.vault', v)) ok = true;
  if (!ok) throw new Error('無法寫入瀏覽器儲存空間');
}

/* =====================================================================
 * 5. Session 與自動儲存（Debounce 500ms）
 * ===================================================================== */
let KEY = null, META = null, S = null;
let saveTimer = null, dirty = false, saving = Promise.resolve();

function touch(){
  if (track()) { editSeq++; syncPending = true; scheduleSync(); }
  dirty = true; setInd('saving');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
function flush(){
  clearTimeout(saveTimer);
  if (!dirty || !KEY || !S) return saving;
  dirty = false;
  const snap = S, key = KEY, meta = META;
  saving = saving.then(async () => {
    try {
      const sealed = await seal(key, snap);
      await writeVault({ v:1, salt:meta.salt, iter:meta.iter, keyAt:meta.keyAt || 0, ...sealed });
      if (S === snap) {
        setInd('saved');
        const h = $('#draft-hint'); if (h) h.textContent = '● 草稿已自動儲存 ' + fmtDT(now()).split(' ')[1];
      }
    } catch (e) { dirty = true; setInd('error'); }
  });
  return saving;
}
function setInd(state){ localState = state; renderInd(); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flush(); if (syncPending) syncNow(); }
  else if (S?.sync && !syncFatal) syncNow();
});
window.addEventListener('pagehide', () => flush());
window.addEventListener('online', () => { if (S?.sync && !syncFatal) syncNow(); });

function migrate(d){
  const base = defaultState();
  const s = { ...base, ...(d || {}) };
  s.settings = { ...base.settings, ...(d?.settings || {}) };
  s.ui = { ...base.ui, ...(d?.ui || {}) };
  for (const k of ['categories','priorities','festivals','items']) if (!Array.isArray(s[k])) s[k] = base[k];
  if (!s.deleted || typeof s.deleted !== 'object' || Array.isArray(s.deleted)) s.deleted = {};
  s.confAt = Number(s.confAt) || 0;
  if (!s.categories.length) s.categories = base.categories;
  if (!s.priorities.length) s.priorities = base.priorities;
  s.items.forEach(i => {
    i.id ??= uid(); i.status ??= 'active'; i.extraDays ??= 0; i.reflections ??= {};
    i.createdAt ??= now(); i.startAt ??= i.createdAt; i.amount = Number(i.amount) || 0;
  });
  return s;
}

/* =====================================================================
 * 5b. 跨裝置同步：GitHub 私人 Gist 存放「同一份密文」
 *     - 雲端只存 AES-GCM 密文，金鑰只在主密碼裡
 *     - 品項逐筆合併（較新的 updatedAt 勝出），刪除用墓碑
 *     - 分類／順序／購物節／設定 以較新的 confAt 為準
 * ===================================================================== */
const GH = 'https://api.github.com', FILE = 'dms-vault.json';
const CONF_KEYS = ['settings','categories','priorities','festivals'];
let localState = 'saved', syncState = 'off', syncMsg = '', syncFatal = false;
let lastSyncAt = 0, syncing = false, syncAgain = false, syncTimer = null;
let syncPending = false, editSeq = 0, pendingRender = false;
let sigItems = null, sigConf = null;

/* --- 變更追蹤：自動補 updatedAt / confAt / 刪除墓碑 --- */
const confSig = () => JSON.stringify(CONF_KEYS.map(k => S[k]));
const itemSig = it => { const { updatedAt, ...r } = it; return JSON.stringify(r); };
const itemTs = it => it.updatedAt || it.createdAt || 0;
function track(){
  if (!S) return false;
  const t = now(), c = confSig();
  let changed = false;
  if (sigConf !== null && c !== sigConf) { S.confAt = t; changed = true; }
  sigConf = c;
  const m = new Map();
  for (const it of S.items) {
    const s = itemSig(it);
    if (sigItems) {
      if (!sigItems.has(it.id)) changed = true;
      else if (sigItems.get(it.id) !== s) { it.updatedAt = t; changed = true; }
    }
    m.set(it.id, s);
  }
  if (sigItems) for (const id of sigItems.keys()) if (!m.has(id)) { S.deleted[id] = t; changed = true; }
  sigItems = m;
  return changed;
}
function resetTrack(){ sigItems = null; sigConf = null; track(); }

function syncable(s){
  const del = {};
  Object.keys(s.deleted || {}).sort().forEach(k => del[k] = s.deleted[k]);
  return { v:1, settings:s.settings, categories:s.categories, priorities:s.priorities, festivals:s.festivals,
    confAt:s.confAt || 0, deleted:del,
    items:[...s.items].sort((a, b) => (a.createdAt - b.createdAt) || String(a.id).localeCompare(String(b.id))) };
}
function mergeInto(L, R, { conf = true } = {}){
  const before = JSON.stringify(syncable(L));
  const del = { ...(L.deleted || {}) };
  for (const [k, v] of Object.entries(R.deleted || {})) del[k] = Math.max(del[k] || 0, v);
  const cutoff = now() - 180 * DAY;
  for (const k in del) if (del[k] < cutoff) delete del[k];
  const map = new Map(L.items.map(i => [i.id, i]));
  for (const it of R.items) { const cur = map.get(it.id); if (!cur || itemTs(it) > itemTs(cur)) map.set(it.id, it); }
  L.items = [...map.values()].filter(it => !(del[it.id] && del[it.id] >= itemTs(it)));
  L.deleted = del;
  if (conf && (R.confAt || 0) > (L.confAt || 0)) { for (const k of CONF_KEYS) L[k] = R[k]; L.confAt = R.confAt; }
  return JSON.stringify(syncable(L)) !== before;
}

/* --- GitHub API --- */
function ghErr(msg, kind){ const e = new Error(msg); e.kind = kind; return e; }
async function gh(method, path, token, body){
  let r;
  try {
    r = await fetch(GH + path, { method, cache:'no-store',
      headers:{ Accept:'application/vnd.github+json', Authorization:'Bearer ' + token, ...(body ? { 'Content-Type':'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw ghErr(navigator.onLine === false ? '目前離線，恢復連線後會自動同步' : '暫時連不到 GitHub，稍後會自動重試', 'offline');
  }
  if (r.status === 401) throw ghErr('GitHub 權杖無效或已過期，請到「設定 → 跨裝置同步」重新設定', 'auth');
  if (r.status === 404) throw ghErr('找不到雲端同步資料（Gist 可能被刪除，或權杖沒有 gist 權限）', 'notfound');
  if (r.status === 403 || r.status === 429) throw ghErr('GitHub 暫時拒絕請求（權杖缺少 gist 權限，或請求太頻繁）', 'error');
  if (!r.ok) throw ghErr(`GitHub 回應錯誤（${r.status}）`, 'error');
  return r.status === 204 ? null : r.json();
}
async function gistGet(sync){
  const g = await gh('GET', '/gists/' + encodeURIComponent(sync.gistId), sync.token);
  const f = g?.files?.[FILE]; if (!f) return null;
  let c = f.content;
  if (f.truncated && f.raw_url) c = await (await fetch(f.raw_url, { cache:'no-store' })).text();
  try { return JSON.parse(c); } catch { return null; }
}
const vaultRecord = sealed => ({ v:1, salt:META.salt, iter:META.iter, keyAt:META.keyAt || 0, ...sealed });
const gistPut = (sync, rec) => gh('PATCH', '/gists/' + encodeURIComponent(sync.gistId), sync.token, { files:{ [FILE]:{ content:JSON.stringify(rec) } } });
const gistCreate = (token, rec) => gh('POST', '/gists', token, { description:'慾望清單・冷靜期｜加密同步資料（請勿手動修改）', public:false, files:{ [FILE]:{ content:JSON.stringify(rec) } } });
async function findGist(token){
  const list = await gh('GET', '/gists?per_page=100', token);
  return (list || []).find(g => g.files && g.files[FILE]) || null;
}

/* --- 同步主流程：拉取 → 解密 → 合併 → 有差異才上傳 --- */
function scheduleSync(ms = 2000){
  if (!S?.sync?.gistId || syncFatal) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), ms);
}
async function syncNow(){
  if (!S?.sync?.gistId || !KEY) return false;
  if (syncing) { syncAgain = true; return false; }
  syncing = true; clearTimeout(syncTimer); setSync('syncing');
  const sess = KEY, sync = { ...S.sync };
  try {
    const remote = await gistGet(sync);
    if (KEY !== sess) return false;
    let R = null, changedLocal = false;
    if (remote && remote.ct) {
      if (remote.salt !== META.salt) {
        if ((remote.keyAt || 0) >= (META.keyAt || 0)) { setSync('rekey', '主密碼已在其他裝置變更，請輸入新的主密碼'); return false; }
        /* 這台裝置剛變更主密碼 → 直接以本機為準覆寫 */
      } else {
        let data;
        try { data = await unseal(KEY, remote); } catch { setSync('rekey', '無法解密雲端資料，請重新輸入主密碼'); return false; }
        if (KEY !== sess) return false;
        R = migrate(data);
        changedLocal = mergeInto(S, R);
      }
    }
    const payload = syncable(S), seq = editSeq;
    if (!R || JSON.stringify(payload) !== JSON.stringify(syncable(R))) {
      await gistPut(sync, vaultRecord(await seal(KEY, payload)));
      if (KEY !== sess) return false;
    }
    if (changedLocal) { resetTrack(); dirty = true; flush(); softRender(); }
    syncPending = editSeq !== seq;
    lastSyncAt = now(); setSync('ok');
    return true;
  } catch (e) {
    if (KEY === sess) { syncFatal = e.kind === 'auth' || e.kind === 'notfound'; setSync(e.kind === 'offline' ? 'offline' : 'error', e.message); }
    return false;
  } finally {
    syncing = false;
    if (syncAgain && KEY === sess) { syncAgain = false; scheduleSync(300); }
  }
}
function softRender(){
  const a = document.activeElement;
  if (modalKind || (a && a.closest && a.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) { pendingRender = true; return; }
  render();
}

/* --- 狀態指示 --- */
function setSync(state, msg = ''){

  if (state !== 'error') syncFatal = false;

  const st = $('#sync-status'); if (st) { st.textContent = syncStatusText(); st.className = 'pill ' + syncPillCls(); }
}
function syncStatusText(){

  return { syncing:'同步中…', ok: lastSyncAt ? `已同步 · ${fmtDT(lastSyncAt).split(' ')[1]}` : '已同步',
    offline:'離線中，恢復後自動同步', error:'同步失敗：' + syncMsg, rekey:'需要輸入新的主密碼', off:'準備同步…' }[syncState] || '已同步';
}
const syncPillCls = () => !S?.sync ? '' : (syncState === 'error' || syncState === 'rekey') ? 'bad' : syncState === 'offline' ? 'warn' : 'on';
function renderInd(){
  const el = $('#save-ind'); if (!el) return;

  else if (syncState === 'syncing' || (syncPending && syncState === 'ok') || localState === 'saving') { cls = 'saving'; text = '同步中…'; }
  else if (syncState === 'ok') { cls = 'saved'; text = '已同步'; title = lastSyncAt ? '最後同步 ' + fmtDT(lastSyncAt) + '，點此立即同步' : ''; }
  else if (syncState === 'offline') { cls = 'warn'; text = '離線・已存本機'; title = syncMsg; }
  else if (syncState === 'rekey') { cls = 'error'; text = '請重新輸入主密碼'; title = syncMsg; }
  else if (syncState === 'error') { cls = 'error'; text = '同步失敗'; title = syncMsg; }
  else { cls = 'saving'; text = '準備同步…'; }

/* --- 同步碼：gistId + token，以主密碼金鑰加密 --- */
async function makeCode(){
  const sealed = await seal(KEY, { g:S.sync.gistId, t:S.sync.token });
  return 'DMS1.' + b64url(te.encode(JSON.stringify({ s:META.salt, i:META.iter, iv:sealed.iv, ct:sealed.ct })));
}
function codeFromText(text){
  const s = String(text || '').trim();
  const m = s.match(/sync=([A-Za-z0-9._~-]+)/);
  return m ? m[1] : s;
}
async function resolveCode(text, pw){
  const code = codeFromText(text);
  if (/^(ghp_|github_pat_|gho_|ghu_)/.test(code)) {
    const g = await findGist(code);
    if (!g) throw new Error('這個 GitHub 帳號還沒有同步資料，請先在第一台裝置開啟同步');
    return { gistId:g.id, token:code };
  }
  if (!code.startsWith('DMS1.')) throw new Error('同步碼格式不正確，請複製完整內容');
  let obj;
  try { obj = JSON.parse(td.decode(unb64url(code.slice(5)))); } catch { throw new Error('同步碼格式不正確，請複製完整內容'); }
  const key = await deriveKey(pw, unb64(obj.s), obj.i);
  let info;
  try { info = await unseal(key, obj); } catch { throw new Error('主密碼不正確，或同步碼已失效（主密碼變更後要重新產生）'); }
  return { gistId:info.g, token:info.t, key, salt:obj.s };
}
async function fetchRemote(text, pw){
  const r = await resolveCode(text, pw);
  const sync = { gistId:r.gistId, token:r.token };
  const remote = await gistGet(sync);
  if (!remote || !remote.ct) throw new Error('雲端上找不到同步資料');
  const key = (r.key && r.salt === remote.salt) ? r.key : await deriveKey(pw, unb64(remote.salt), remote.iter);
  let data;
  try { data = await unseal(key, remote); } catch { throw new Error('主密碼不正確（若最近變更過主密碼，請輸入新的）'); }
  return { key, meta:{ salt:remote.salt, iter:remote.iter, keyAt:remote.keyAt || 0 }, data, sync };
}

/* 網址帶 #sync=… 時（手機掃 QR Code 開啟），先記住再清掉網址 */

}

let lockMode = 'unlock';

async function showLock(force){

       <input type="password" id="pw1" placeholder="設定主密碼（至少 4 個字元）" autocomplete="new-password">
       <input type="password" id="pw2" placeholder="再輸入一次" autocomplete="new-password">`;

  } else if (lockMode === 'connect') {

       <textarea id="sync-code" rows="3" placeholder="貼上同步碼或登入連結">${esc(pendingCode || '')}</textarea>
       <input type="password" id="pw1" placeholder="主密碼（與其他裝置相同）" autocomplete="current-password">`;
    modeLink.textContent = v ? '返回解鎖' : '第一次使用？建立新的主密碼';
  } else {
    fields.innerHTML = `${pendingCode ? '<p class="lock-note">解鎖這台裝置後，會接著引導你連結同步。</p>' : ''}
       <input type="password" id="pw1" placeholder="輸入主密碼" autocomplete="current-password">`;
    modeLink.textContent = '改用同步碼登入';
  }
  $('#lock-btn').textContent = { setup:'建立並進入', connect:'連結並進入', unlock:'解鎖' }[lockMode];
  $('#reset-link').hidden = lockMode !== 'unlock';
  $('#lock-err').textContent = (window.crypto && crypto.subtle) ? '' : '此環境不支援加密，請以 https 網址或最新版瀏覽器開啟。';
  $('#app').hidden = true; $('#lock').hidden = false;
  setTimeout(() => (lockMode === 'connect' && !pendingCode ? $('#sync-code') : $('#pw1'))?.focus(), 60);
}

$('#lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw1')?.value || '', err = $('#lock-err'), btn = $('#lock-btn');
  if (!(window.crypto && crypto.subtle)) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '處理中…'; err.textContent = '';
  try {
    if (lockMode === 'setup') {
      if (pw.length < 4) throw new Error('主密碼至少需要 4 個字元');
      if (pw !== $('#pw2').value) throw new Error('兩次輸入的密碼不一致');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      META = { salt:b64(salt), iter:PBKDF2_ITER, keyAt:now() };
      KEY = await deriveKey(pw, salt, PBKDF2_ITER);
      S = defaultState();
      dirty = true; await flush();
    } else if (lockMode === 'connect') {
      const code = $('#sync-code').value;
      if (!code.trim()) throw new Error('請貼上同步碼或登入連結');
      if (!pw) throw new Error('請輸入主密碼');
      const r = await fetchRemote(code, pw);
      KEY = r.key; META = r.meta;
      S = migrate(r.data); S.sync = r.sync; S.draft = null;
      pendingCode = null;
      dirty = true; await flush();
    } else {
      const v = await readVault();
      const key = await deriveKey(pw, unb64(v.salt), v.iter);
      let data;
      try { data = await unseal(key, v); } catch { throw new Error('主密碼不正確。若剛在其他裝置改過主密碼，請先輸入這台裝置原本的密碼，或改用同步碼登入。'); }
      KEY = key; META = { salt:v.salt, iter:v.iter, keyAt:v.keyAt || 0 }; S = migrate(data);
    }
    enterApp();
  } catch (ex) {
    err.textContent = ex.message || '發生錯誤，請再試一次';
    $('#pw1')?.select();
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

function enterApp(){

const catName  = id => S.categories.find(c => c.id === id)?.name || '未分類';
const prioName = id => S.priorities.find(p => p.id === id)?.name || '—';
const prioIdx  = id => { const i = S.priorities.findIndex(p => p.id === id); return i < 0 ? 99 : i; };
const festName = id => S.festivals.find(f => f.id === id)?.name || '';
const getItem  = id => S.items.find(i => i.id === id);

const unlockAt = it => it.startAt + (tierOf(it.amount).days + (Number(it.extraDays) || 0)) * DAY;
function stateOf(it){
  if (it.status === 'purchased' || it.status === 'abandoned') return it.status;
  return now() >= unlockAt(it) ? 'unlocked' : 'cooling';
}
const isActive = it => { const s = stateOf(it); return s === 'cooling' || s === 'unlocked'; };
function progressOf(it){
  const total = unlockAt(it) - it.startAt;
  return Math.max(0, Math.min(1, (now() - it.startAt) / total));
}
const dailySaving = () => (Number(S.settings.monthlySaving) || 0) / 30;
function factsOf(amount){
  const out = [], w = Number(S.settings.hourlyWage) || 0, d = dailySaving();
  if (w > 0) out.push(`約需工作 ${n1(amount / w)} 小時`);
  if (d > 0) out.push(`延後儲蓄目標 ${n1(amount / d)} 天`);
  return out.join(' · ');
}
function computeStart(ds, it){
  if (!ds) return it ? it.startAt : now();
  if (it && ymd(it.startAt) === ds) return it.startAt;
  if (ds === ymd(now())) return now();
  return parseYmd(ds);
}

/* 購物節 */
function festDate(f, y){
  if (f.rule === 'blackfriday') {
    const wd = new Date(y, 10, 1).getDay();
    const fourthThu = 1 + ((4 - wd + 7) % 7) + 21;
    return new Date(y, 10, fourthThu + 1).getTime();
  }
  return new Date(y, (f.m || 1) - 1, f.d || 1).getTime();
}
function festMap(years){
  const m = {};
  for (const y of years) for (const f of S.festivals) (m[ymd(festDate(f, y))] ??= []).push(f.name);
  return m;
}
function upcomingFests(n){
  const t0 = sod(now()), y = new Date().getFullYear();
  return S.festivals.map(f => { let d = festDate(f, y); if (d < t0) d = festDate(f, y + 1); return { f, d }; })
    .sort((a, b) => a.d - b.d).slice(0, n);
}

        <select data-filter="tier" aria-label="金額區間"><option value="all">全部金額</option>${TIERS.map(t => `<option value="${t.key}" ${F.tier === t.key ? 'selected' : ''}>${t.sign} ${t.label}</option>`).join('')}</select>
        <select data-filter="sort" aria-label="排序">
          ${[['unlock','最快解鎖'],['priority','重要順序'],['amountDesc','金額高→低'],['amountAsc','金額低→高'],['newest','最新加入']].map(([k,l]) => `<option value="${k}" ${F.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
    </section>
    <section class="grid" id="grid"></section>`;
  renderGrid();
}

function renderGrid(){
  const g = $('#grid'); if (!g) return;
  const q = F.q.trim().toLowerCase();
  const arr = S.items.filter(it => {
    const s = stateOf(it);
    if (F.status === 'active' && !(s === 'cooling' || s === 'unlocked')) return false;
    if (!['active','all'].includes(F.status) && s !== F.status) return false;
    if (F.cat !== 'all' && it.categoryId !== F.cat) return false;
    if (F.tier !== 'all' && tierOf(it.amount).key !== F.tier) return false;
    if (q && !`${it.name} ${it.note || ''} ${catName(it.categoryId)}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const sorters = {
    unlock: (a,b) => unlockAt(a) - unlockAt(b),
    priority: (a,b) => prioIdx(a.priorityId) - prioIdx(b.priorityId) || unlockAt(a) - unlockAt(b),
    amountDesc: (a,b) => b.amount - a.amount,
    amountAsc: (a,b) => a.amount - b.amount,
    newest: (a,b) => b.createdAt - a.createdAt,
  };
  arr.sort(sorters[F.sort] || sorters.unlock);
  if (!arr.length) {
    g.innerHTML = S.items.length
      ? `<div class="empty"><p>沒有符合條件的品項。</p></div>`
      : `<div class="empty"><span class="mark lg"></span><h3>清單是空的</h3><p>想買什麼，先放進來冷靜一下。</p>
         <div class="empty-actions"><button class="btn primary" data-act="add">＋ 新增第一個慾望</button><button class="btn" data-act="load-sample">載入範例（試算表 4 筆）</button></div></div>`;
    return;
  }
  g.innerHTML = arr.map(card).join('');
}

function card(it){
  const t = tierOf(it.amount), s = stateOf(it), ua = unlockAt(it);
  const done = s === 'purchased' || s === 'abandoned';
  let status = '';
  if (s === 'cooling') {
    status = it.startAt > now()
      ? `預計 ${fmtMD(it.startAt)} 開始冷靜 · ${fmtDT(ua)} 解鎖`
      : `剩餘 <b>${remain(ua - now())}</b> · ${fmtDT(ua)} 解鎖`;
  } else if (s === 'unlocked') status = `<b>已解鎖</b>，可以做決定了`;
  else if (s === 'purchased') status = `已於 ${fmtMD(it.decidedAt)} 購買`;
  else status = `已於 ${fmtMD(it.decidedAt)} 放棄 · 省下 ${fmt(it.amount)}`;

  const link = safeUrl(it.link);
  const fest = festName(it.festival);
  const extra = Math.round(Number(it.extraDays) || 0);
  const facts = factsOf(it.amount);
  const tools = `<span class="spacer"></span>
    <button class="icon-btn" data-act="edit" data-id="${it.id}" title="編輯" aria-label="編輯">${ICON.edit}</button>
    <button class="icon-btn" data-act="del" data-id="${it.id}" title="刪除" aria-label="刪除">${ICON.trash}</button>`;
  const acts = done
    ? `<button class="btn sm" data-act="restore" data-id="${it.id}">移回清單</button>${tools}`
    : `<button class="btn sm ${s === 'unlocked' ? 'primary' : ''}" data-act="buy" data-id="${it.id}" ${s === 'cooling' ? 'disabled' : ''}>${s === 'cooling' ? ICON.lock + ' 冷靜中' : '確定購買'}</button>
       <button class="btn sm" data-act="postpone" data-id="${it.id}">延後</button>
       <button class="btn sm" data-act="abandon" data-id="${it.id}">放棄</button>${tools}`;

  return `<article class="item ${t.cls}${done ? ' done' : ''}">
    <div class="item-top"><span class="badge">${t.sign} ${t.label} · ${tierDays(t)}</span><span class="prio" title="重要順序">${esc(prioName(it.priorityId))}</span></div>
    <h3>${esc(it.name)}</h3>
    <div class="amount">${fmt(it.amount)}</div>
    <div class="meta"><span>${esc(catName(it.categoryId))}</span><span>${fmtMD(it.startAt)} 加入</span>${extra > 0 ? `<span>已延後 ${extra} 天</span>` : ''}${fest ? `<span class="tag">${esc(fest)}</span>` : ''}</div>
    ${done ? '' : `<div class="track"><i style="width:${s === 'unlocked' ? 100 : (progressOf(it) * 100).toFixed(1)}%"></i></div>`}
    <div class="cd">${status}</div>
    ${facts && !done ? `<div class="facts">${facts}</div>` : ''}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
    ${link ? `<a class="link-out" href="${esc(link)}" target="_blank" rel="noopener noreferrer">↗ ${esc(hostOf(link))}</a>` : ''}
    <div class="actions">${acts}</div>
  </article>`;
}

/* ---------- 日曆 ---------- */
function renderCalendar(){
  const td0 = new Date();
  if (S.ui.calY == null) { S.ui.calY = td0.getFullYear(); S.ui.calM = td0.getMonth(); }
  const y = S.ui.calY, m = S.ui.calM;
  const lead = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((lead + dim) / 7) * 7;
  const fm = festMap([y - 1, y, y + 1]);
  const starts = {}, unlocks = {};
  for (const it of S.items) {
    if (!isActive(it)) continue;
    (starts[ymd(it.startAt)] ??= []).push(it);
    (unlocks[ymd(unlockAt(it))] ??= []).push(it);
  }
  const todayK = ymd(now());
  let grid = ['日','一','二','三','四','五','六'].map(w => `<div class="cal-wd">${w}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const dt = new Date(y, m, 1 - lead + i), k = ymd(dt), out = dt.getMonth() !== m;
    const chips = [...(starts[k] || []).map(it => ({ it, type:'start' })), ...(unlocks[k] || []).map(it => ({ it, type:'unlock' }))];
    const shown = chips.slice(0, 3), more = chips.length - shown.length;
    grid += `<div class="cal-cell${out ? ' out' : ''}${k === todayK ? ' today' : ''}${fm[k] ? ' has-fest' : ''}" data-act="cal-day" data-date="${k}" data-drop="${k}">
      <div class="cal-head"><span class="cal-num">${dt.getDate()}</span>${fm[k] ? `<span class="fest" title="${esc(fm[k].join('、'))}">${esc(fm[k][0])}</span>` : ''}</div>
      ${shown.map(({ it, type }) => chipHtml(it, type)).join('')}
      ${more > 0 ? `<button class="more" data-act="cal-more" data-date="${k}">＋${more} 項</button>` : ''}
    </div>`;
  }

  const t0 = sod(now());
  const drill = upcomingFests(3).map(({ f, d }) => {
    const left = Math.round((d - t0) / DAY);
    return `<div class="drill-item">
      <div class="drill-title"><b>${esc(f.name)}</b><span>${fmtMD(d)} · ${left === 0 ? '就是今天' : `還有 ${left} 天`}</span></div>
      ${TIERS.map(t => { const dl = d - t.days * DAY, late = dl < t0;
        return `<div class="drill-row ${t.cls}${late ? ' late' : ''}"><span><i class="dot"></i>${t.sign} ${t.label}・${tierDays(t)}</span><span>${late ? '已來不及' : '最晚 ' + fmtMD(dl)}</span></div>`; }).join('')}
    </div>`;
  }).join('');

  view.innerHTML = `<div class="cal-wrap">
    <section class="panel">
      <div class="cal-nav">
        <h2>${y} 年 ${m + 1} 月</h2>
        <button class="btn sm" data-act="cal-today">今天</button>
        <button class="icon-btn" data-act="cal-prev" aria-label="上個月">${ICON.left}</button>
        <button class="icon-btn" data-act="cal-next" aria-label="下個月">${ICON.right}</button>
      </div>
      <div class="cal-grid">${grid}</div>
      <p class="desc" style="margin-top:10px">點日期即可在該日新增慾望；把實心標籤拖到別天，可調整冷靜期起點。</p>
    </section>
    <aside class="stack">
      <section class="panel">
        <h3>購物節冷靜期演練</h3>
        <p class="desc">想在購物節當天下單？依金額區間，最晚要在這些日期前加入清單，才能剛好解鎖。</p>
        ${drill}
      </section>
      <section class="panel">
        <h3>圖例</h3>
        <div class="legend-row"><span class="chip start t-amber">品項</span>冷靜期起點（可拖曳）</div>
        <div class="legend-row"><span class="chip unlock t-amber">品項</span>解鎖日</div>
        ${TIERS.map(t => `<div class="legend-row ${t.cls}"><i class="dot"></i>${t.sign} ${t.label}　${t.max === Infinity ? '30,001 以上' : '≤ ' + t.max.toLocaleString('zh-TW')}　${tierDays(t)}</div>`).join('')}
      </section>
    </aside>
  </div>`;
}
function chipHtml(it, type){
  const t = tierOf(it.amount);
  const drag = type === 'start' && stateOf(it) === 'cooling';
  return `<div class="chip ${t.cls} ${type}" data-act="edit" data-id="${it.id}" ${drag ? `draggable="true" data-drag="${it.id}"` : ''}
    title="${esc(it.name)} · ${fmt(it.amount)} · ${type === 'unlock' ? '解鎖日' : '冷靜期起點'}">${type === 'unlock' ? '解鎖 ' : ''}${esc(it.name)}</div>`;
}
function shiftMonth(n){
  let m = S.ui.calM + n, y = S.ui.calY;
  while (m < 0) { m += 12; y--; } while (m > 11) { m -= 12; y++; }
  S.ui.calY = y; S.ui.calM = m; touch(); render();
}
function openDay(k){
  const list = S.items.filter(it => isActive(it) && (ymd(it.startAt) === k || ymd(unlockAt(it)) === k));
  openModal(`<div class="modal sm" role="dialog" aria-modal="true">
    <header><h2>${fmtMD(parseYmd(k))} 的項目</h2><button class="icon-btn" data-act="modal-close" aria-label="關閉">${ICON.close}</button></header>
    <div class="modal-body">${list.map(it => `<button class="day-row ${tierOf(it.amount).cls}" data-act="edit" data-id="${it.id}"><i class="dot"></i><span>${esc(it.name)}</span><small>${ymd(it.startAt) === k ? '冷靜期起點' : '解鎖日'} · ${fmt(it.amount)}</small></button>`).join('')}</div>
    <footer><span class="hint"></span><button class="btn primary" data-act="cal-add" data-date="${k}">在這天新增</button></footer>
  </div>`);
}

/* 拖拽：調整冷靜期起點 */
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-drag]'); if (!el) return;
  e.dataTransfer.setData('text/plain', el.dataset.drag); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => {
  const c = e.target.closest?.('[data-drop]'); if (!c) return;
  e.preventDefault();
  document.querySelectorAll('.cal-cell.drop').forEach(x => x !== c && x.classList.remove('drop'));
  c.classList.add('drop');
});
document.addEventListener('dragleave', e => {
  const c = e.target.closest?.('[data-drop]');
  if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop');
});
document.addEventListener('drop', e => {
  const c = e.target.closest?.('[data-drop]'); if (!c || !S) return;
  e.preventDefault(); c.classList.remove('drop');
  const it = getItem(e.dataTransfer.getData('text/plain')); if (!it) return;
  const k = c.dataset.drop; if (k === ymd(it.startAt)) return;
  const old = new Date(it.startAt), nd = new Date(parseYmd(k));
  nd.setHours(old.getHours(), old.getMinutes(), 0, 0);
  it.startAt = nd.getTime(); it.updatedAt = now();
  touch(); render();
  toast(`「${it.name}」的冷靜期起點移到 ${fmtMD(it.startAt)}，${fmtDT(unlockAt(it))} 解鎖`);
});

function renderGantt(){
  const st = S.settings;
  const num = (k, label) => `<label class="f">${label}<input type="number" min="0" step="100" inputmode="numeric" data-bind="${k}" value="${esc(st[k])}"></label>`;
  view.innerHTML = `<div class="stack">
    <section class="panel" id="gantt-dyn"></section>
    <section class="panel">
      <div class="panel-head"><h2>儲蓄量表</h2><span class="desc">修改數字會即時重算並自動儲存</span></div>
      <div class="kv">
        ${num('savingsPool','目前儲蓄池 (NTD)')}
        ${num('savingsGoal','儲蓄目標 (NTD)')}
        ${num('monthlySaving','每月可存 (NTD)')}
        ${num('hourlyWage','時薪（換算工時）')}
      </div>
      <div id="budget-dyn"></div>
    </section>
  </div>`;
  renderGanttDyn();
}
let dynTimer;
const debounceDyn = () => { clearTimeout(dynTimer); dynTimer = setTimeout(renderGanttDyn, 250); };

function renderGanttDyn(){
  const gEl = $('#gantt-dyn'), bEl = $('#budget-dyn'); if (!gEl || !bEl) return;
  const st = S.settings;
  const act = S.items.filter(isActive).sort((a, b) => unlockAt(a) - unlockAt(b));
  const pool = Number(st.savingsPool) || 0, goal = Number(st.savingsGoal) || 0, daily = dailySaving();
  const t0 = sod(now());

  /* 時間軸範圍 */
  let lo = t0 - 2 * DAY, hi = t0 + 14 * DAY;
  for (const i of act) { lo = Math.min(lo, sod(i.startAt)); hi = Math.max(hi, sod(unlockAt(i)) + DAY); }
  hi += DAY;
  const span = hi - lo, days = Math.round(span / DAY);
  const P = t => (t - lo) / span * 100;
  const step = days <= 18 ? 2 : days <= 36 ? 4 : days <= 70 ? 7 : 14;
  let ticks = '', lines = '';
  for (let k = 0; k <= days; k += step) {
    const t = lo + k * DAY;
    ticks += `<span class="g-tick" style="left:${P(t)}%">${fmtMD(t)}</span>`;
    lines += `<i class="g-grid" style="left:${P(t)}%"></i>`;
  }
  const todayX = P(now());

  const rows = act.map(it => {
    const t = tierOf(it.amount), s = stateOf(it), ua = unlockAt(it);
    const L = P(it.startAt), W = Math.max(1, P(ua) - L);
    const label = s === 'unlocked' ? '已解鎖（可購買）'
      : it.startAt > now() ? `${fmtMD(it.startAt)} 開始` : `冷靜期中（剩餘 ${remainShort(ua - now())}）`;
    const pos = W >= 26 ? 'in' : (L + W < 70 ? 'after' : 'before');
    const outStyle = pos === 'after' ? `left:calc(${L + W}% + 6px)` : `right:calc(${100 - L}% + 6px)`;
    const sub = [fmt(it.amount), daily > 0 ? `延後目標 ${n1(it.amount / daily)} 天` : ''].filter(Boolean).join(' · ');
    return `<div class="g-row">
      <div class="g-label" data-act="edit" data-id="${it.id}" title="${esc(it.name)}"><b>${esc(it.name)}</b><span>${sub}</span></div>
      <div class="g-track">${lines}
        <div class="g-bar ${t.cls} ${s}" style="left:${L}%;width:${W}%" title="${esc(it.name)}：${fmtDT(it.startAt)} → ${fmtDT(ua)}">
          <i class="g-fill" style="width:${s === 'unlocked' ? 100 : (progressOf(it) * 100).toFixed(1)}%"></i>${pos === 'in' ? `<span class="g-text">${label}</span>` : ''}
        </div>
        ${pos !== 'in' ? `<span class="g-text out ${t.cls}" style="${outStyle}">${label}</span>` : ''}
        <i class="g-today" style="left:${todayX}%"></i>
      </div>
    </div>`;
  }).join('');

  gEl.innerHTML = `<div class="panel-head"><h2>慾望冷靜甘特圖</h2><span class="pool">當前儲蓄池　<b>${fmt(pool)}</b></span></div>
    ${act.length ? `
      <div class="g-axis"><div class="g-label"></div><div class="g-track">${ticks}<span class="g-today-label" style="left:${todayX}%">今天</span></div></div>
      ${rows}` : `<div class="g-empty">目前沒有冷靜中的品項。</div>`}`;

  /* 預算佔用率 */
  const pending = sum(act);
  const ratio = pool > 0 ? pending / pool : (pending > 0 ? Infinity : 0);
  const over = ratio > 1;
  const pctText = ratio === Infinity ? '儲蓄池為 0' : over ? `超出預算池 ${((ratio - 1) * 100).toFixed(1)}%` : `${(ratio * 100).toFixed(1)}%`;

  /* 目標推算 */
  let goalMain = '—', goalSub = '';
  if (goal <= 0) { goalMain = '未設定'; goalSub = '在上方填入儲蓄目標'; }
  else if (pool >= goal) { goalMain = '已達成'; goalSub = `目標 ${fmt(goal)}`; }
  else if (daily <= 0) { goalMain = '—'; goalSub = '填入每月可存金額即可推算'; }
  else { const d1 = Math.ceil((goal - pool) / daily); goalMain = `${d1} 天後`; goalSub = `約 ${fmtMD(t0 + d1 * DAY)} 達成 ${fmt(goal)}`; }
  const delay = daily > 0 ? pending / daily : 0;
  const goalPct = goal > 0 ? Math.min(100, pool / goal * 100) : 0;

  bEl.innerHTML = `<div class="budget">
      <div class="budget-top"><span>衝動預算總額佔用率</span><b class="${over ? 'over' : ''}">${pctText}</b></div>
      <div class="bar ${over ? 'over' : ''}"><i style="width:${Math.min(100, ratio === Infinity ? 100 : ratio * 100)}%"></i></div>
      <p class="desc">冷靜中與已解鎖品項合計 ${fmt(pending)}，儲蓄池 ${fmt(pool)}。</p>
    </div>
    <div class="goal-grid">
      <div class="mini"><small>儲蓄目標進度</small><b>${goal > 0 ? goalPct.toFixed(0) + '%' : '—'}</b><div class="bar" style="height:6px;margin-top:6px"><i style="width:${goalPct}%"></i></div></div>
      <div class="mini"><small>照目前速度達成目標</small><b>${goalMain}</b><p>${goalSub}</p></div>
      <div class="mini"><small>若清單全部買下</small><b>${daily > 0 ? `延後 ${n1(delay)} 天` : '—'}</b><p>${daily > 0 ? `等於 ${n1(delay / 30)} 個月的存款` : '填入每月可存金額即可推算'}</p></div>
    </div>`;
}

let modalKind = null, dialogResolve = null;
function openModal(html, kind = 'generic'){
  if (dialogResolve) { const r = dialogResolve; dialogResolve = null; r(null); }
  $('#modal-root').innerHTML = `<div class="overlay" data-overlay>${html}</div>`;
  modalKind = kind;
  const f = $('#modal-root [autofocus]'); if (f) f.focus({ preventScroll:true });
}
function closeModal(){
  if (modalKind === 'item' && S?.draft) { S.draft = null; touch(); }
  $('#modal-root').innerHTML = ''; modalKind = null;
  if (dialogResolve) { const r = dialogResolve; dialogResolve = null; r(null); }
  else if (pendingRender && S) render();
}
function dialog({ title, body = '', fields = [], ok = '確定', cancel = '取消', danger = false }){
  return new Promise(res => {
    openModal(`<div class="modal sm" role="dialog" aria-modal="true">
      <header><h2>${esc(title)}</h2></header>
      <form class="modal-body" id="dlg-form">${body}
        ${fields.map((f, i) => `<label class="f">${esc(f.label)}<input type="${f.type || 'text'}" name="${f.name}" value="${esc(f.value || '')}" ${i === 0 ? 'autofocus' : ''}></label>`).join('')}
      </form>
      <footer><span class="hint"></span>${cancel ? `<button class="btn ghost" type="button" data-act="dlg-cancel">${cancel}</button>` : ''}<button class="btn ${danger ? 'danger-solid' : 'primary'}" type="button" data-act="dlg-ok">${ok}</button></footer>
    </div>`, 'dialog');
    dialogResolve = res;
  });
}
function dlgOk(){
  const form = $('#dlg-form'); let val = true;
  if (form) { const inputs = [...form.querySelectorAll('input[name]')]; if (inputs.length) { val = {}; inputs.forEach(i => val[i.name] = i.value); } }
  const r = dialogResolve; dialogResolve = null;
  $('#modal-root').innerHTML = ''; modalKind = null;
  r && r(val);
}

  const it = getItem(id); if (!it) return;

/* ---------- 延後 / 放棄 / 移回 / 刪除 ---------- */
function openPostpone(id){
  const it = getItem(id); if (!it) return;
  const extra = Math.round(Number(it.extraDays) || 0);
  openModal(`<div class="modal sm" role="dialog" aria-modal="true">
    <header><h2>延後冷靜期</h2><button class="icon-btn" data-act="modal-close" aria-label="關閉">${ICON.close}</button></header>
    <div class="modal-body">
      <p>「${esc(it.name)}」${stateOf(it) === 'unlocked' ? '已解鎖' : `預計 ${fmtDT(unlockAt(it))} 解鎖`}。再給自己一點時間：</p>
      <div class="pp-grid">${[1,3,7,14].map(n => `<button class="btn" data-act="postpone-do" data-id="${id}" data-days="${n}">＋${n} 天</button>`).join('')}</div>
      ${extra > 0 ? `<button class="btn ghost sm" data-act="postpone-do" data-id="${id}" data-days="0">取消延後（目前已延後 ${extra} 天）</button>` : ''}
    </div>
  </div>`);
}
function doPostpone(id, n){
  const it = getItem(id); if (!it) return;
  const base = tierOf(it.amount).days;
  if (n === 0) it.extraDays = 0;
  else {
    const target = Math.max(unlockAt(it), now()) + n * DAY;
    it.extraDays = (target - it.startAt) / DAY - base;
  }
  it.updatedAt = now();
  closeModal(); touch(); render();
  toast(n ? `已延後，${fmtDT(unlockAt(it))} 解鎖` : '已取消延後');
}

function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
async function importCSV(file){
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) { try { text = new TextDecoder('big5').decode(buf); } catch {} }
  text = text.replace(/^\uFEFF/, '');
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => r.some(c => String(c).includes('金額')));
  if (hi < 0) { toast('找不到「金額」欄位，請確認 CSV 有標題列'); return; }
  const H = rows[hi].map(c => String(c).trim().toLowerCase());
  const col = (...keys) => H.findIndex(h => keys.some(k => h.includes(k)));
  const ci = col('類別','分類'), ni = col('項目','清單','名稱','品項'), ai = col('金額'), pi = col('重要','順序','優先'), li = col('連結','網址','link','url');
  if (ni < 0) { toast('找不到品項名稱欄位（項目／名稱）'); return; }
  const body = rows.slice(hi + 1).filter(r => String(r[ni] || '').trim());
  if (!body.length) { toast('CSV 裡沒有可匯入的資料列'); return; }
  const ok = await dialog({ title:`從 CSV 匯入 ${body.length} 筆？`, body:'<p>會新增到現有清單，冷靜期從現在開始計算。找不到對應的分類或重要順序時，會自動新增。</p>', ok:'匯入' });
  if (!ok) return;
  const matchCat = raw => {
    raw = String(raw || '').trim(); if (!raw) return (S.categories.find(c => c.name === '雜項支出') || S.categories[0]).id;
    const ex = S.categories.find(c => c.name === raw); if (ex) return ex.id;
    const key = raw.replace(/類$/, '').slice(0, 2);
    const fz = key && S.categories.find(c => c.name.includes(key)); if (fz) return fz.id;
    const c = { id:uid(), name:raw }; S.categories.push(c); return c.id;
  };
  const matchPrio = raw => {
    raw = String(raw || '').trim(); if (!raw) return S.priorities[Math.floor((S.priorities.length - 1) / 2)].id;
    const ex = S.priorities.find(p => p.name.toUpperCase() === raw.toUpperCase()); if (ex) return ex.id;
    const p = { id:uid(), name:raw }; S.priorities.push(p); return p.id;
  };
  const t = now();
  body.forEach(r => {
    const name = String(r[ni]).trim().replace(/^\d+\s*[.、)）]\s*/, '');
    const amount = Math.round(Number(String(ai >= 0 ? r[ai] : '').replace(/[^\d.]/g, '')) || 0);
    S.items.push({ id:uid(), name, amount, categoryId:matchCat(ci >= 0 ? r[ci] : ''), priorityId:matchPrio(pi >= 0 ? r[pi] : ''),
      link:safeUrl(li >= 0 ? r[li] : ''), note:'', festival:'', reflections:{}, startAt:t, extraDays:0, status:'active', createdAt:t, updatedAt:t });
  });
  touch(); render(); toast(`已匯入 ${body.length} 筆`);
}

async function connectDo(el){

  el.disabled = true; el.textContent = '連結中…';
  try {
    await flush();
    const r = await fetchRemote(code, pw);
    const R = migrate(r.data);
    let added = 0;
    if (merge) {
      const keyOf = i => `${String(i.name).trim()}|${Math.round(i.amount)}`;
      const have = new Set(R.items.map(keyOf)), ids = new Set(R.items.map(i => i.id)), t = now();
      for (const it of S.items) {
        if (ids.has(it.id) || have.has(keyOf(it))) continue;
        const cn = catName(it.categoryId), pn = prioName(it.priorityId);
        let c = R.categories.find(x => x.name === cn);
        if (!c) { c = { id:uid(), name:cn }; R.categories.push(c); R.confAt = t; }
        const p = R.priorities.find(x => x.name === pn) || R.priorities[Math.floor((R.priorities.length - 1) / 2)];
        R.items.push({ ...it, categoryId:c.id, priorityId:p.id, festival:R.festivals.some(f => f.id === it.festival) ? it.festival : '', updatedAt:t });
        have.add(keyOf(it)); added++;
      }
    }
    R.ui = S.ui; R.draft = null; R.sync = r.sync;
    S = R; KEY = r.key; META = r.meta;
    resetTrack(); syncPending = added > 0; syncFatal = false;
    $('#modal-root').innerHTML = ''; modalKind = null;
    dirty = true; await flush(); render();
    toast(added ? `已連結，並合併了這台裝置的 ${added} 個品項` : '已連結，資料已同步到這台裝置');
    syncNow();
  } catch (e) {
    err.textContent = e.message;
    if (el.isConnected) { el.disabled = false; el.textContent = '連結'; }
  }
}

  'cal-day': el => openItemModal({ startDate:el.dataset.date }),
  'cal-add': el => openItemModal({ startDate:el.dataset.date }),
  'cal-more': el => openDay(el.dataset.date),
  'cal-prev': () => shiftMonth(-1),
  'cal-next': () => shiftMonth(1),
  'cal-today': () => { const d = new Date(); S.ui.calY = d.getFullYear(); S.ui.calM = d.getMonth(); touch(); render(); },
  buy: (el, id) => openBuy(id),
  'buy-confirm': (el, id) => confirmBuy(id),
  postpone: (el, id) => openPostpone(id),
  'postpone-do': (el, id) => doPostpone(id, Number(el.dataset.days)),
  abandon: (el, id) => doAbandon(id),
  restore: (el, id) => doRestore(id),
  del: (el, id) => doDelete(id),
  'modal-close': () => closeModal(),
  'draft-save': () => saveDraft(),
  'newcat-add': () => addNewCatInModal(),
  'f-status': el => { F.status = el.dataset.v; renderList(); },
  lock: () => lockApp(),
  'load-sample': () => loadSample(),
  'cat-add': () => addCat(), 'cat-del': (el, id) => delCat(id), 'cat-restore': () => restoreCats(),
  'prio-add': () => addPrio(), 'prio-del': (el, id) => delPrio(id),
  'prio-up': (el, id) => movePrio(id, -1), 'prio-down': (el, id) => movePrio(id, 1),
  'fest-add': () => addFest(), 'fest-del': (el, id) => delFest(id),
  accent: el => { S.settings.accent = el.dataset.v; touch(); render(); },
  'export-enc': () => exportEnc(), 'export-plain': () => exportPlain(),
  'import-json': () => $('#file-json').click(), 'import-csv': () => $('#file-csv').click(),
  'wipe-items': () => wipeItems(), 'reset-all': () => resetAll(), 'change-pw': () => changePw(),
  'dlg-ok': () => dlgOk(), 'dlg-cancel': () => closeModal(),
  'sync-ind': () => indClick(),
  'sync-enable': el => enableSync(el),
  'sync-connect': () => openConnect({}),
  'sync-connect-do': el => connectDo(el),
  'sync-code': () => showSyncCode(false),
  'copy-code': () => copyCode(),
  'sync-now': () => indClick(),
  'sync-reauth': () => reauth(),
  'sync-off': () => syncOff(),
  'lock-mode': async () => { const v = await readVault(); showLock(lockMode === 'connect' ? (v ? 'unlock' : 'setup') : 'connect'); },
};
const NEEDS_NO_SESSION = new Set(['reset-all','dlg-ok','dlg-cancel','modal-close','lock-mode']);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (!S && !NEEDS_NO_SESSION.has(el.dataset.act)) return;
  e.preventDefault();
  fn(el, el.dataset.id, e);
});
document.addEventListener('mousedown', e => {
  if (e.target.matches?.('[data-overlay]') && modalKind && modalKind !== 'item' && modalKind !== 'buy') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalKind && modalKind !== 'item') closeModal();
  if (e.key === 'Enter' && e.target.id === 'cat-new') { e.preventDefault(); addCat(); }
  if (e.key === 'Enter' && e.target.id === 'prio-new') { e.preventDefault(); addPrio(); }
  if (e.key === 'Enter' && e.target.id === 'newcat-name') { e.preventDefault(); addNewCatInModal(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'dlg-form') { e.preventDefault(); dlgOk(); }
  if (e.target.id === 'connect-form') { e.preventDefault(); const b = $('[data-act="sync-connect-do"]'); if (b && !b.disabled) connectDo(b); }
});
document.addEventListener('input', e => {
  const el = e.target; if (!S) return;
  const ds = el.dataset;
  if (ds.draft !== undefined && S.draft) {
    if (ds.draft === 'categoryId' && el.value === '__new') { $('#newcat').hidden = false; $('#newcat-name').focus(); return; }
    if (ds.draft === 'categoryId') $('#newcat').hidden = true;
    S.draft.data[ds.draft] = el.value; touch();
    if (ds.draft === 'amount' || ds.draft === 'startDate') updateTierPreview();
  } else if (ds.reflect !== undefined && S.draft) {
    const q = tierOf(S.draft.data.amount).questions[Number(ds.reflect)];
    S.draft.data.reflections = { ...(S.draft.data.reflections || {}), [q]: el.value }; touch();
  } else if (ds.buyq !== undefined) {
    const it = getItem(ds.id); if (!it) return;
    const q = tierOf(it.amount).questions[Number(ds.buyq)];
    it.reflections = { ...(it.reflections || {}), [q]: el.value }; touch();
    $('#buy-err') && ($('#buy-err').textContent = '');
  } else if (ds.bind) {
    S.settings[ds.bind] = (el.type === 'number' || ds.num) ? (Number(el.value) || 0) : el.value; touch();
    if (S.ui.tab === 'gantt') debounceDyn();
  } else if (ds.rename) {
    const list = { cat:S.categories, prio:S.priorities, fest:S.festivals }[ds.rename];
    const o = list?.find(x => x.id === ds.id); if (!o) return;
    const f = ds.field || 'name';
    if (f === 'name') { const v = el.value.trim(); if (!v) return; o.name = v; }
    else { const n = parseInt(el.value, 10); if (f === 'm' && n >= 1 && n <= 12) o.m = n; if (f === 'd' && n >= 1 && n <= 31) o.d = n; }
    touch();
  } else if (ds.filter) {
    F[ds.filter] = el.value; renderGrid();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.id === 'file-json' || t.id === 'file-csv') && t.files?.[0] && S) {
    const f = t.files[0]; t.value = '';
    (t.id === 'file-json' ? importJSON : importCSV)(f);
  }
});

/* =====================================================================
 * 11. 啟動
 * ===================================================================== */
showLock();
})();
</script>
</body>
</html>
